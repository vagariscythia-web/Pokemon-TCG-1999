<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Articuno Blizzard — Stock Actor Preview (Hit &amp; Whiff)</title>
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin: 0;
    }
    h1 { color: #38bdf8; font-size: 18px; margin: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      max-width: 700px;
      width: 100%;
    }
    .card-box {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    h3 { margin: 0; color: #7dd3fc; font-size: 14px; }
    .card-stage {
      width: 180px;
      height: 252px;
      background: #0f172a;
      border: 3px solid #0ea5e9;
      border-radius: 10px;
      position: relative;
      overflow: visible;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .actor {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 144px;
      height: 144px;
      transform: translate(-50%, -50%);
      animation: gbaBlizzardStockWingSpread 1.75s cubic-bezier(0.18, 0.92, 0.28, 1) forwards;
    }
    .actor.whiff {
      width: 78px;
      height: 78px;
      filter: saturate(0.4) brightness(0.85);
      animation: gbaBlizzardStockWhiff 1.75s ease-out forwards;
    }
    .actor img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(56,189,248,0.75)) drop-shadow(0 0 9px rgba(207,250,254,0.5));
      pointer-events: none;
      user-select: none;
    }
    button {
      padding: 8px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    p { font-size: 11px; color: #94a3b8; margin: 0; text-align: center; }

    @keyframes gbaBlizzardStockWingSpread {
      0%   { transform: translate(-50%, -50%) scale(0.55) translateY(14px); opacity: 0; }
      14%  { transform: translate(-50%, -50%) scale(0.62) translateY(18px); opacity: 0; }
      32%  { transform: translate(-50%, -50%) scale(1.06) translateY(-4px); opacity: 1; }
      46%  { transform: translate(-50%, -50%) scale(1.14) translateY(-8px); opacity: 1; }
      60%  { transform: translate(-50%, -50%) scale(1.10) translateY(-6px); opacity: 1; }
      80%  { transform: translate(-50%, -50%) scale(0.98) translateY(2px); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(0.88) translateY(6px); opacity: 0; }
    }
    @keyframes gbaBlizzardStockWhiff {
      0%   { transform: translate(-50%, -50%) scale(0.5) translateY(16px); opacity: 0; }
      14%  { transform: translate(-50%, -50%) scale(0.55) translateY(20px); opacity: 0; }
      34%  { transform: translate(-50%, -50%) scale(0.82) translateY(-2px); opacity: 0.45; }
      52%  { transform: translate(-50%, -50%) scale(0.86) translateY(-4px); opacity: 0.4; }
      74%  { transform: translate(-50%, -50%) scale(0.78) translateY(4px); opacity: 0.25; }
      100% { transform: translate(-50%, -50%) scale(0.68) translateY(10px); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>Articuno — Blizzard (Stock Actor: /assets/raw/Articuno_raw_edited.png)</h1>
  <div class="grid">
    <div class="card-box">
      <h3>HIT</h3>
      <div class="card-stage">
        <div class="actor" id="hit-actor">
          <img src="assets/raw/Articuno_raw_edited.png" alt="Articuno Blizzard" draggable="false">
        </div>
      </div>
      <button onclick="replay('hit-actor')">Replay</button>
      <p>gbaBlizzardStockWingSpread · 1.75s · anticipation %0-14 · peak %46</p>
    </div>
    <div class="card-box">
      <h3>WHIFF</h3>
      <div class="card-stage">
        <div class="actor whiff" id="whiff-actor">
          <img src="assets/raw/Articuno_raw_edited.png" alt="Articuno Blizzard (whiff)" draggable="false">
        </div>
      </div>
      <button onclick="replay('whiff-actor')">Replay</button>
      <p>gbaBlizzardStockWhiff · 1.75s · suppressed opacity/saturate · stagger kırık</p>
    </div>
  </div>
  <script>
    function replay(id) {
      var el = document.getElementById(id);
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    }
  </script>
</body>
</html>
