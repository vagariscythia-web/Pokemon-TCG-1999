<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mewtwo Psionic Smoke VFX Comparison</title>
  <style>
    body {
      background: #090a16;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      gap: 30px;
    }
    .cards-row {
      display: flex;
      gap: 40px;
    }
    .card-box {
      width: 280px;
      height: 380px;
      background: #1e1b4b;
      border: 2px solid #a855f7;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
    }
    .card-title {
      margin-top: 15px;
      font-weight: bold;
      color: #f0abfc;
      z-index: 50;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Option 1: Animated WebP */
    .webp-actor {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 256px;
      height: 256px;
      pointer-events: none;
      z-index: 20;
    }

    /* Option 2: Sprite Sheet with CSS Steps */
    @keyframes gbaMewtwoVFXSheet {
      from { background-position: 0px 0px; }
      to   { background-position: -7680px 0px; }
    }
    @keyframes gbaMewtwoVFXMotion {
      0%   { transform: translate(-50%, -50%) scale(0.70) rotate(-6deg); opacity: 0; filter: brightness(1.1); }
      16%  { transform: translate(-50%, -50%) scale(0.90) rotate(-2deg); opacity: 0.95; }
      48%  { transform: translate(-50%, -50%) scale(1.08) rotate(3deg); opacity: 1.0; }
      66%  { transform: translate(-50%, -50%) scale(1.28) rotate(8deg); opacity: 1.0; filter: drop-shadow(0 0 35px #d946ef) brightness(1.35); }
      84%  { transform: translate(-50%, -54%) scale(1.42) rotate(13deg); opacity: 0.75; }
      100% { transform: translate(-50%, -58%) scale(1.55) rotate(18deg); opacity: 0; filter: blur(6px); }
    }

    .sheet-actor {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 256px;
      height: 256px;
      background-image: url('assets/Mewtwo_Psionic_Miasma_Sheet.png');
      background-repeat: no-repeat;
      background-size: 7680px 256px;
      animation: 
        gbaMewtwoVFXSheet 1.75s steps(30) infinite,
        gbaMewtwoVFXMotion 1.75s cubic-bezier(0.2, 0.8, 0.25, 1) infinite;
      pointer-events: none;
      z-index: 20;
    }

    .mewtwo-silhouette {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 156px;
      z-index: 30;
      filter: drop-shadow(0 0 15px #c026d3);
    }
  </style>
</head>
<body>
  <h2>Mewtwo Psionic Smoke VFX Integration Test</h2>
  <div class="cards-row">
    <!-- Card 1: Animated WebP -->
    <div class="card-box">
      <div class="card-title">1. Animated WebP</div>
      <div class="stage">
        <img src="assets/Mewtwo_Psionic_Miasma_Anim.webp" class="webp-actor" />
        <img src="assets/Mewtwo_Psychic_Actor.png" class="mewtwo-silhouette" />
      </div>
    </div>

    <!-- Card 2: Sprite Sheet with CSS Steps + Macro Motion -->
    <div class="card-box">
      <div class="card-title">2. Sprite Sheet (CSS steps)</div>
      <div class="stage">
        <div class="sheet-actor"></div>
        <img src="assets/Mewtwo_Psychic_Actor.png" class="mewtwo-silhouette" />
      </div>
    </div>
  </div>
</body>
</html>
