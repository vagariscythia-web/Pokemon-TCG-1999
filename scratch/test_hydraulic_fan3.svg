<svg xmlns="http://www.w3.org/2000/svg" width="176" height="136" viewBox="0 0 176 136" style="background:#050b14;">
  <defs>
    <!-- Deep High-Pressure Hydraulic Mass Gradient -->
    <radialGradient id="fanMassGrad3" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#e0f2fe" stop-opacity="0.98" />
      <stop offset="42%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="68%" stop-color="#0284c7" stop-opacity="0.90" />
      <stop offset="90%" stop-color="#0369a1" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Left Wing Hydraulic Jet Gradient -->
    <linearGradient id="jetGradL3" x1="85%" y1="95%" x2="0%" y2="5%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#0ea5e9" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Right Wing Hydraulic Jet Gradient -->
    <linearGradient id="jetGradR3" x1="15%" y1="95%" x2="100%" y2="5%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#0ea5e9" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Central Plume Vertical Gradient -->
    <linearGradient id="plumeGradC3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.96" />
      <stop offset="68%" stop-color="#bae6fd" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Aerated Foam Wash Gradient -->
    <radialGradient id="foamWash3" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="32%" stop-color="#e0f2fe" stop-opacity="0.92" />
      <stop offset="65%" stop-color="#7dd3fc" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Massive Volumetric Hydraulic Fan Sheaf (Pure Dynamic V-Eruption) -->
  <!-- Base origin at convergence (88, 96), soaring upward into 5 wide hydrodynamic sheets -->
  <path d="M88 96
           C74 98, 54 104, 38 112
           C44 94, 36 78, 22 62
           C8 46, 2 32, 4 22
           C12 28, 22 36, 28 44
           C32 28, 42 16, 56 12
           C66 10, 72 22, 74 34
           C78 18, 82 4, 88 4
           C94 4, 98 18, 102 34
           C104 22, 110 10, 120 12
           C134 16, 144 28, 148 44
           C154 36, 164 28, 172 22
           C174 32, 168 46, 154 62
           C140 78, 132 94, 138 112
           C122 104, 102 98, 88 96 Z"
        fill="url(#fanMassGrad3)"
        filter="drop-shadow(0 0 16px rgba(56,189,248,0.9))" />

  <!-- 2. Dense Aerated Wave Foam Core (Fills the entire center and webbing with solid water body) -->
  <path d="M88 90
           C76 92, 60 96, 48 102
           C50 88, 44 74, 34 60
           C26 48, 18 36, 18 28
           C24 34, 32 40, 38 48
           C42 34, 50 22, 60 20
           C68 18, 72 30, 74 40
           C78 26, 82 12, 88 10
           C94 12, 98 26, 102 40
           C104 30, 108 18, 116 20
           C126 22, 134 34, 138 48
           C144 40, 152 34, 158 28
           C158 36, 150 48, 142 60
           C132 74, 126 88, 128 102
           C116 96, 100 92, 88 90 Z"
        fill="url(#foamWash3)" />

  <!-- 3. Left Sweeping High-Velocity Jet Sheet & Ligament Tendons -->
  <path d="M88 88 C70 86, 48 76, 30 60 C16 48, 8 36, 6 26 C14 30, 24 40, 36 50 C50 62, 70 76, 88 80 Z"
        fill="url(#jetGradL3)" />
  <path d="M84 84 C66 78, 48 68, 32 52 C22 42, 14 32, 14 26 C20 30, 30 40, 44 50 C58 60, 72 72, 84 84 Z"
        fill="#ffffff" opacity="0.9" />
  <!-- Left Tendon Claws -->
  <path d="M6 26 Q 18 34, 28 44 Q 18 48, 8 40 Z" fill="#bae6fd" opacity="0.9" />
  <path d="M28 44 Q 42 22, 56 16 Q 48 30, 38 38 Z" fill="#ffffff" opacity="0.92" />

  <!-- 4. Right Sweeping High-Velocity Jet Sheet & Ligament Tendons -->
  <path d="M88 88 C106 86, 128 76, 146 60 C160 48, 168 36, 170 26 C162 30, 152 40, 140 50 C126 62, 106 76, 88 80 Z"
        fill="url(#jetGradR3)" />
  <path d="M92 84 C110 78, 128 68, 144 52 C154 42, 162 32, 162 26 C156 30, 146 40, 132 50 C118 60, 104 72, 92 84 Z"
        fill="#ffffff" opacity="0.9" />
  <!-- Right Tendon Claws -->
  <path d="M170 26 Q 158 34, 148 44 Q 158 48, 168 40 Z" fill="#bae6fd" opacity="0.9" />
  <path d="M148 44 Q 134 22, 120 16 Q 128 30, 138 38 Z" fill="#ffffff" opacity="0.92" />

  <!-- 5. Towering Center V-Plume Eruption (Fountain Sheaf) -->
  <path d="M76 88 C72 62, 70 32, 88 4 C106 32, 104 62, 100 88 Z"
        fill="url(#plumeGradC3)" filter="drop-shadow(0 0 14px rgba(56,189,248,0.95))" />
  <path d="M80 82 C76 56, 76 34, 88 10 C100 34, 100 56, 96 82 Z"
        fill="#ffffff" opacity="0.96" />
  <path d="M84 76 C82 50, 82 30, 88 14 C94 30, 94 50, 92 76 Z"
        fill="#ffffff" />

  <!-- 6. Sugimori Fluid Claw Streamlines & Frothing Crest Edges -->
  <path d="M88 88 Q 60 60, 14 30 Q 42 58, 70 78" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.95" />
  <path d="M88 88 Q 116 60, 162 30 Q 134 58, 106 78" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.95" />
  <path d="M88 88 Q 74 44, 88 6 Q 102 44, 88 88" fill="none" stroke="#ffffff" stroke-width="3.0" stroke-linecap="round" opacity="0.98" />
  <path d="M78 82 Q 52 42, 58 14 Q 66 34, 76 70" fill="none" stroke="#e0f2fe" stroke-width="2.0" stroke-linecap="round" opacity="0.9" />
  <path d="M98 82 Q 124 42, 118 14 Q 110 34, 100 70" fill="none" stroke="#e0f2fe" stroke-width="2.0" stroke-linecap="round" opacity="0.9" />

  <!-- 7. High-Pressure Nozzle Inflow Roots (Connecting seamlessly to left +28 deg and right +30 deg jet torrents) -->
  <path d="M42 110 C54 102, 70 94, 88 92 C106 94, 122 102, 134 110 C120 102, 104 98, 88 98 C72 98, 56 102, 42 110 Z"
        fill="#0284c7" opacity="0.85" />
  <path d="M52 106 C64 98, 76 94, 88 94 C100 94, 112 98, 124 106 C112 100, 100 97, 88 97 C76 97, 64 100, 52 106 Z"
        fill="#ffffff" opacity="0.9" />

  <!-- 8. Organic High-Pressure Hydraulic Collision Core (Pure Natural Hyperbaric Burst) -->
  <path d="M88 68 C76 68, 70 74, 68 82 C66 92, 76 96, 88 96 C100 96, 110 92, 108 82 C106 74, 100 68, 88 68 Z"
        fill="#ffffff" filter="drop-shadow(0 0 16px #ffffff)" />
  <path d="M88 72 C80 72, 74 76, 74 82 C74 88, 80 92, 88 92 C96 92, 102 88, 102 82 C102 76, 96 72, 88 72 Z"
        fill="#ffffff" />
</svg>
