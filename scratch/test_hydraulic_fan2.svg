<svg xmlns="http://www.w3.org/2000/svg" width="176" height="136" viewBox="0 0 176 136" style="background:#050b14;">
  <defs>
    <!-- Deep High-Pressure Hydraulic Mass Gradient -->
    <radialGradient id="fanMassGrad" cx="50%" cy="75%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="18%" stop-color="#e0f2fe" stop-opacity="0.98" />
      <stop offset="38%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.90" />
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Left Wing Hydraulic Jet Gradient -->
    <linearGradient id="jetGradL" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#7dd3fc" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Right Wing Hydraulic Jet Gradient -->
    <linearGradient id="jetGradR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#7dd3fc" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Central Plume Vertical Gradient -->
    <linearGradient id="plumeGradC" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.96" />
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Aerated Foam Wash Gradient -->
    <radialGradient id="foamWash" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Massive Primary Volumetric Hydraulic Fan Sheet (Broad Asymmetrical Sugimori Wave Mass) -->
  <!-- Radiates from collision epicenter (88, 92) into 5 massive interconnected hydrodynamic plumes -->
  <path d="M88 108
           C68 108, 48 98, 28 86
           C12 76, 2 62, 4 48
           C6 38, 16 38, 24 46
           C28 32, 40 18, 54 14
           C64 12, 70 24, 74 36
           C78 20, 82 4, 88 4
           C94 4, 98 20, 102 36
           C106 24, 112 12, 122 14
           C136 18, 148 32, 152 46
           C160 38, 170 38, 172 48
           C174 62, 164 76, 148 86
           C128 98, 108 108, 88 108 Z"
        fill="url(#fanMassGrad)"
        filter="drop-shadow(0 0 16px rgba(56,189,248,0.9))" />

  <!-- 2. Dense Aerated Wave Foam Core (Fills the entire center and mid-wings with heavy liquid mass) -->
  <path d="M88 100
           C72 100, 54 92, 38 80
           C26 70, 16 58, 20 48
           C26 46, 32 54, 38 60
           C42 46, 52 30, 62 26
           C70 24, 74 36, 78 46
           C80 32, 84 14, 88 12
           C92 14, 96 32, 98 46
           C102 36, 106 24, 114 26
           C124 30, 134 46, 138 60
           C144 54, 150 46, 156 48
           C160 58, 150 70, 138 80
           C122 92, 104 100, 88 100 Z"
        fill="url(#foamWash)" />

  <!-- 3. Left Sweeping High-Pressure Jet Sheet & Tearing Ligaments (Driven by +28 deg Left Cannon) -->
  <path d="M88 92 C68 86, 42 72, 22 54 C10 44, 4 34, 6 26 C12 30, 20 44, 34 54 C48 64, 68 76, 88 80 Z"
        fill="url(#jetGradL)" />
  <path d="M82 88 C64 80, 44 66, 26 48 C16 38, 10 30, 12 24 C18 28, 26 40, 40 50 C54 60, 70 70, 82 88 Z"
        fill="#ffffff" opacity="0.9" />
  <!-- Left claw tendril / Sugimori curl -->
  <path d="M4 48 Q 16 36, 26 48 Q 20 58, 8 58 Z" fill="#bae6fd" opacity="0.85" />
  <path d="M26 36 Q 40 18, 54 22 Q 46 36, 34 42 Z" fill="#ffffff" opacity="0.9" />

  <!-- 4. Right Sweeping High-Pressure Jet Sheet & Tearing Ligaments (Driven by +30 deg Right Cannon) -->
  <path d="M88 92 C108 86, 134 72, 154 54 C166 44, 172 34, 170 26 C164 30, 156 44, 142 54 C128 64, 108 76, 88 80 Z"
        fill="url(#jetGradR)" />
  <path d="M94 88 C112 80, 132 66, 150 48 C160 38, 166 30, 164 24 C158 28, 150 40, 136 50 C122 60, 106 70, 94 88 Z"
        fill="#ffffff" opacity="0.9" />
  <!-- Right claw tendril / Sugimori curl -->
  <path d="M172 48 Q 160 36, 150 48 Q 156 58, 168 58 Z" fill="#bae6fd" opacity="0.85" />
  <path d="M150 36 Q 136 18, 122 22 Q 130 36, 142 42 Z" fill="#ffffff" opacity="0.9" />

  <!-- 5. Towering Center V-Plume Eruption (Fountain Sheaf) -->
  <path d="M76 90 C72 64, 70 34, 88 6 C106 34, 104 64, 100 90 Z"
        fill="url(#plumeGradC)" filter="drop-shadow(0 0 12px rgba(56,189,248,0.95))" />
  <path d="M80 84 C76 58, 76 36, 88 12 C100 36, 100 58, 96 84 Z"
        fill="#ffffff" opacity="0.96" />
  <path d="M84 76 C82 52, 82 32, 88 16 C94 32, 94 52, 92 76 Z"
        fill="#ffffff" />

  <!-- 6. Sugimori Fluid Claw Streamlines & Frothing Crest Edges -->
  <path d="M88 92 Q 62 64, 18 38 Q 44 64, 72 82" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.95" />
  <path d="M88 92 Q 114 64, 158 38 Q 132 64, 104 82" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.95" />
  <path d="M88 92 Q 74 46, 88 8 Q 102 46, 88 92" fill="none" stroke="#ffffff" stroke-width="3.0" stroke-linecap="round" opacity="0.98" />
  <path d="M78 86 Q 52 46, 58 18 Q 66 38, 76 74" fill="none" stroke="#e0f2fe" stroke-width="2.0" stroke-linecap="round" opacity="0.9" />
  <path d="M98 86 Q 124 46, 118 18 Q 110 38, 100 74" fill="none" stroke="#e0f2fe" stroke-width="2.0" stroke-linecap="round" opacity="0.9" />

  <!-- 7. Organic High-Pressure Hydraulic Collision Core (Pure Natural Hyperbaric Burst - No Ellipse) -->
  <path d="M88 70 C78 70, 72 76, 70 84 C68 94, 78 100, 88 100 C98 100, 108 94, 106 84 C104 76, 98 70, 88 70 Z"
        fill="#ffffff" filter="drop-shadow(0 0 16px #ffffff)" />
  <path d="M88 74 C82 74, 76 78, 76 84 C76 90, 82 94, 88 94 C94 94, 100 90, 100 84 C100 78, 94 74, 88 74 Z"
        fill="#ffffff" />
</svg>
